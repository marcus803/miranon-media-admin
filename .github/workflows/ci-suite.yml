---
name: CI Suite (reusable)

# Reusable tung testsvit (task-36.2 / T85 våg 2a, ADR-077). EN KÄLLA för de
# sex tunga jobben (fyra + acceptance sedan task-59.3 + webblasarbeteende
# sedan TASK-131) — anropad av TRE workflows, och vilken av dem som anropar
# avgör numera vad som faktiskt körs:
#   · ci.yml       — presubmit, villkorat på should_skip_tests. Skickar
#                    `run_staging: false` (A7:5) och `run_a11y: false` (A7:6),
#                    båda VILLKORSLÖST ⇒ endast TRE av de sex instansieras här
#                    (`Pure + Build`, `Acceptance (hermetisk)` och
#                    `Webblasarbeteende` — inget av de tre bär ett `run_x`-
#                    villkor eller ett dependabot-skip, se resp. jobb).
#   · post-merge.yml — det mergade trädet på main. Skickar INGA inputs.
#   · nightly.yml  — schemalagd fullsvit. Skickar INGA inputs.
# De två sistnämnda får därmed defaulterna (allt true) och är de ytor där
# staging och a11y faktiskt körs. Inputarna finns för att STYRA anropar-ytan —
# raderas ett jobb här försvinner det ur ALLA tre samtidigt.
#
# Extraherad ur
# ci.yml S79 (verbatim steg); villkoren flyttade: caller-jobbet i ci.yml
# gatar HELA anropet på should_skip_tests, så inner-jobben bär ENDAST sina
# dependabot-/purge-/input-villkor. github.actor-uttrycket fungerar i alla
# kontexterna (schedule/dispatch är aldrig dependabot).
#
# INGA fetch-depth-bärare bor här: de tre bärarna (changed/lint/docs) stannar
# i ci.yml — fetch-depth-invarianten (ADR-039/054, scripts/check-fetch-depth-
# invariant.sh läser ci.yml, EXPECTED_CI_CARRIERS=3) förblir ORÖRD. Lägg
# ALDRIG en fetch-depth-rad i detta jobb utan att uppdatera invarianten.
#
# secrets: inherit hos anroparen → staging-secrets når test-staging/purge/a11y
# direkt (bevisat via reusable-spike 2026-07-23, run 30036119790).

on:
  workflow_call:
    inputs:
      run_staging:
        description: >-
          true (default) = kör staging-stegen (purge + test-staging). false =
          de två jobben instansieras inte alls (ingen mutex). ci.yml skickar
          false VILLKORSLÖST sedan A7:5 (TASK-70.3); post-merge.yml och
          nightly.yml skickar ingen input och får därför defaulten. Inputen
          styr ENBART purge + test-staging — vad de tre övriga jobben gör
          avgörs av sina egna villkor, aldrig av detta ord. (Formuleringen
          nämnde tidigare D1-klassen som enda avsändare av false; den
          beskrivningen slutade gälla med TASK-70.3.)
        type: boolean
        default: true
      run_a11y:
        description: >-
          true (default) = kör A11y (axe-runner). false = jobbet instansieras
          inte alls. ci.yml skickar false VILLKORSLÖST sedan A7:6
          (TASK-70.4) — a11y ligger inte längre i den blockerande PR-grinden.
          post-merge.yml och nightly.yml skickar INGEN input och får defaulten
          true; kontrollen är alltså FLYTTAD, aldrig borttagen. Att i stället
          radera jobbet ur denna fil hade tagit bort det ur nattnätet OCH
          post-merge-lagret — därför en flagga hos anroparen och inte en
          radering här.
        type: boolean
        default: true
      acceptance_selection:
        description: >-
          Blankstegsseparerad lista med spec-filer som `Acceptance (hermetisk)`
          ska köra I STÄLLET för hela klassen. TOM STRÄNG (default) = hela
          klassen. Till skillnad från de två flaggorna ovan är detta ingen
          på/av-lever utan ett UTFALL: ci.yml fyller den ur `changed`-jobbets
          `acceptance_urval` (TASK-75), som är tom i varje läge utom när varenda
          ändrad fil utanför D0-klassen är en acceptance-spec-fil som finns på
          disk.

          DEFAULTEN ÄR SJÄLVA SKYDDSNÄTET, inte en bekvämlighet.
          `post-merge.yml` och `nightly.yml` skickar INGEN input och kör därför
          hela klassen på varje mergat träd respektive varje natt. Det är den
          arbetsdelning hela A7 vilar på (ADR-077 § Kontext, Google-modellen: en
          riskanpassad presubmit är försvarbar ENDAST med ett post-submit-nät
          under sig). Byts defaulten mot något annat än tom sträng ärver de två
          ytorna ett urval, och nätet upphör att finnas — scripts/
          test-acceptance-urval.sh T15f grindar just den raden.
        type: string
        default: ''

permissions: {}

jobs:
  # Staging sentinel purge — setup-purge FÖRE staging-stegen (ADR-060 punkt
  # 3–4, wirad via TASK-16): sentinel-rader äldre än ålders-guarden raderas ur
  # staging-basen INNAN staging-jobbet skapar nya. EGET jobb = egen runner-VM
  # med EGEN secret (EF-only-gränsen, ADR-060 punkt 2+4).
  purge:
    name: Staging sentinel purge
    # Dependabot-skip på JOBB-nivå (ADR-031 Lager 3 — Dependabot-runs saknar
    # Actions-secrets och rör aldrig staging). Docs-only-skippet bärs numera
    # av caller-gaten (ci.yml suite-jobbets if: should_skip_tests != 'true').
    # inputs.run_staging: false vid D1 (ren UI-ändring, task-36.3) → purge
    # onödig (staging skippas) ⇒ hoppas med (internt villkor, ej path-filter).
    if: ${{ inputs.run_staging && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        # SHA-pin: se ci.yml:s FÖRSTA Checkout-steg (jobbet `changed`) för
        # hela rationalen (TASK-312, 2026-08-24) — gäller identiskt för
        # varje actions/checkout · actions/setup-node · actions/cache ·
        # actions/upload-artifact-anropsställe i detta repo.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config: jobbet kör enbart purge-skriptet +
        # policy-filen och behöver ingen git-historik. Utanför fetch-depth-
        # bärar-mängden by design (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Ålders-guarden (60 min, .purge-staging-policy.json) skyddar in-flight-
      # körningar — därför behöver jobbet INTE staging-tests-mutexen.
      #
      # PRECISERAT 2026-07-29 (TASK-76): raden ovan var SANN men OFULLSTÄNDIG.
      # Ålders-guarden skyddar mot att radera FÖR TIDIGT. Den säger ingenting om
      # två purge-körningar som konkurrerar om SAMMA post — ett TOCTOU mellan
      # listSentinels() och deleteSentinels() som gav 404 och fällde jobbet.
      # Det som bär samtidigheten är IDEMPOTENSEN i scripts/purge-staging-
      # sentinels.mjs (isAlreadyDeletedError, fail-closed i fem led och
      # korsläser rec-ID:t mot batchen vi faktiskt bad om), inte ålders-guarden.
      # Mutex-formen vägdes och förkastades: mutexen är CI<->CI och täcker inte
      # CI<->lokal (`npm run purge:staging`), så racet hade överlevt den.
      # STAGING_AIRTABLE_TOKEN = least-privilege-PAT scopad till ENBART
      # staging-basen (data.records:read+write) — kan aldrig röra prod.
      #
      # De fyra TEST_*-secreten nedan (TASK-305) gör att storageTargets-klassen
      # i .purge-staging-policy.json (utkast/-purgen, TASK-302.3) körs här också
      # i stället för att tyst skippas. Dom (research-passet, se filen nedan):
      # ingen ny credential-KLASS — samma fyra secrets flödar redan genom
      # test-staging-jobbet i denna workflow-fil (rad ~699–704) och utövar
      # redan JWT-gated Storage-operationer mot test-attachments-storage-EF:en;
      # detta ger enbart ett andra, redan Airtable-separerat jobb tillgång till
      # en credential-klass som redan finns i workflow-filen (ADR-053-triage:
      # ingen ny riskklass). Fullt underlag:
      # docs/research/ci-stadjobbets-credential-scope-2026-08-23.md § Dom.
      - name: Purge staging sentinels
        run: node scripts/purge-staging-sentinels.mjs
        env:
          STAGING_AIRTABLE_TOKEN: ${{ secrets.STAGING_AIRTABLE_TOKEN }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

  # Pure + Build — mutex-fritt, kör även för dependabot (dep-bump-regression
  # fångas här via pure-tests + build). Split ur gamla Test+Build (S77 våg 1).
  test-fast:
    name: Pure + Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — inga historik-beroende skript.

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: API tests (pure)
        run: npm run test:api:pure

      - name: Build
        run: npm run build

      # Manifest-fältgrinden (TASK-126.1 AC #3 + TASK-126.4 AC #1) —
      # HEMVIST-VALET, skrivet: PRD-textens ordval pekade mot "preview-skarven"
      # (tests/preview/ + scripts/check-staging-bundle.sh,
      # `npm run test:preview:staging`). Verifierat mot samtliga
      # `.github/workflows/*.yml`: den kedjan är ALDRIG anropad av CI (noll
      # träffar på "test:preview:staging", "staging-preview" eller
      # "verify:staging-bundle") — den är ett lokalt verifieringsverktyg
      # (docs/reference/staging-verifiering-runbook.md), inte en CI-grind.
      # Manifestfälten (INKLUSIVE TASK-126.4:s screenshots-fält) är
      # mode-oberoende byggda artefakter och kräver inget nätverk, så de
      # prövas här — direkt efter Build, i jobbet som redan producerar
      # `dist/` OVILLKORLIGT (även för dependabot). Beslutet att detta är den
      # STÅENDE hemvisten för mekaniska manifest-/bundle-grindar (inte bara ett
      # engångsval för 126.1) är bokfört i TASK-130 § Implementation Notes.
      # Se scripts/check-manifest-fields.mjs för full motivering.
      - name: Verify manifest fields (TASK-126.1 + TASK-126.4 gate)
        run: npm run verify:manifest

      # Tvåsidigt bevis samlokaliserat med grinden ovan (samma skäl som
      # dist/-beroendet: guarden och dess test hör ihop, och test-fast är
      # jobbet som redan bygger). Testar PURA funktioner (ingen disk, inget
      # bygge) — kostnaden är miliskunder, inte jobbets tidsbudget värd.
      - name: Test manifest-fältvaktens fyrning (TASK-126.1 + TASK-126.4, tvåsidigt bevis)
        run: node scripts/test-check-manifest-fields.mjs

  # Acceptance (hermetisk) — task-59.3, ADR-080. MUTEXFRITT, och mutexfriheten
  # ligger i PLACERINGEN, inte i en flagga: jobbet har ingen `concurrency`-grupp
  # och inget `needs: [purge]`, så det köar aldrig bakom `staging-tests`. En PR
  # som bara rör appens rendering får sitt svar utan att vänta på en resurs den
  # inte rör.
  #
  # `continue-on-error` FÖREKOMMER INTE OCH FÅR INTE INFÖRAS. Flaggan gör
  # jobbets `needs`-resultat till `success` oavsett utfall — den hade inte gjort
  # jobbet "mjukt", den hade gjort det TYST, och paraply-checken (ci-passed)
  # hade rapporterat grönt på en röd svit. Ska ett jobb inte fälla något löses
  # det med var det ligger (jfr `kontraktsvakt`, som därför bor i nightly.yml
  # och inte här).
  #
  # VILLKORSLÖST — inget `if`, och varje utelämnat villkor är ett medvetet val:
  #   · INGEN `inputs.run_staging`-gate. D1-klassen (ren UI-ändring) är exakt
  #     det fall klassen finns för; att hoppa över den då vore att stänga av
  #     beviset precis när det är enda beviset.
  #   · INGET dependabot-skip. Skippet i purge/a11y/test-staging finns för att
  #     de kräver Actions-secrets som Dependabot-runs saknar. Detta jobb kräver
  #     INGA secrets alls — fixtur-env:en (VITE_SUPABASE_URL/ANON_KEY) bor i
  #     playwright.config.ts som litteraler, inte i `secrets`. En dep-bump som
  #     bryter renderingen fångas därför här, vilket är precis vad man vill.
  #
  # VAD SOM KAN FÄLLA JOBBET: appens beteende, och infrastruktur (checkout,
  # npm ci, browser-nedladdning). Inte staging, inte Airtable, inte en saknad
  # secret, inte en mutex-timeout, inte en annan PR:s data — sviten når inget
  # nätverk utanför localhost (hermetik-vakten avbryter, ADR-080 beslut 4).
  acceptance:
    name: Acceptance (hermetisk)
    runs-on: ubuntu-latest
    # TAKET 8 → 12 (task-59.7). Talet är inte plockat: det är test-stagings tak,
    # och de två jobben har efter A5:s migrering i praktiken samma väggklocka
    # (acceptance 407 s median, staging 393 s median — mätt i CI 2026-07-28).
    # Samma längd ska ha samma tak; annat vore två mått på samma sak.
    #
    # VARFÖR TAKET MÅSTE UPP. Mätt över de tre körningarna efter att alla 18
    # filer var ute: 404 s (`#318`) · 407 s (`#323`) · 452 s (`#324`) mot ett tak
    # på 480 s. Marginalen vid värsta observationen var 28 s — 5,8 %. Samma
    # testmängd i `#323` och `#324`, och de 45 sekundernas skillnad är MÄTT per
    # steg: uppstarten gick 24 → 60 s (varav "Cache Playwright browsers" ensamt
    # 4 → 33 s), medan de två teststegen rörde sig 378 → 384 s. Alltså ~80 %
    # infrastruktur-varians. En enda uppstartsstegs observerade spridning är
    # större än hela den kvarvarande marginalen — nästa körning kan slå i taket
    # utan att någonting har ändrats.
    #
    # KOSTNADEN AV ATT HÖJA, ÄRLIGT. Ett `timeout-minutes` är ett skyddsnät mot
    # en HÄNGD körning, inte ett prestandamål. Höjningens enda pris är att en
    # hängning brinner upp till fyra minuter längre innan den dödas — på ett
    # jobb som varken håller mutex eller blockerar något annat. Priset för att
    # låta taket ligga kvar är en falsk röd på timeout, alltså exakt den
    # signal-förstörelse som parkerade `T87` och motiverade `TASK-61`. Repots
    # egna marginaler säger detsamma: test-staging 12 min / 6,6 min ≈ 1,8× ·
    # a11y 8 min / 1,8 min ≈ 4,4× · Pure + Build 8 min / 0,5 min ≈ 16×.
    # Acceptance låg på 1,18× och var därmed ensam om att sakna marginal.
    #
    # HÖJNINGEN ÄR INTE FIXEN, DEN ÄR ANDRUMMET. Jobbet växte 2,8 → 6,8 min när
    # sviten gick 51 → 152 tester, och den kurvan följer antalet byggda ytor.
    # Den varaktiga häven är parallellisering (workers/shards), som ADR-080 och
    # TASK-59-kortet deferar MED AVSIKT: den linjära skalningen i workers är ett
    # ANTAGANDE som ska mätas när den aktiveras, inte ärvas härifrån. Taket
    # köper tid till den mätningen; det ersätter den inte.
    #
    # ═══ TASK-239 (2026-08-17) — ANDRUMMET TOG SLUT, OCH TAKET RÖRDES INTE ═══
    #
    # Raden ovan förutsade sitt eget utfall: kurvan fortsatte, sviten gick
    # 152 → 233 tester, och taket nåddes. Två post-merge-fällningar betalades
    # — run 31958171806 (12,28 min, `#1428`) och run 31962091899 (12,08 min,
    # `#1434`), båda `cancelled` mot detta tak — med tolv mellanliggande
    # körningar på 8,4–11,6 min. Marginalen var förbrukad, inte krympande.
    #
    # TVÅ ÅTGÄRDER LANDADE, INGEN AV DEM EN TAKHÖJNING:
    #
    #   1. ROTEN. Warmup-gaten (ADR-112/TASK-218.3) körde oavkortat i
    #      fixturvärlden: task-236 varv 2:s seam
    #      (`VITE_E2E_WARMUP_TIMEOUT_MS`) satt bara på e2e-webServern, aldrig
    #      på den acceptance kör mot. Mätt kostnad +75 s isolerat i detta
    #      jobbs teststeg (08-15 → 08-16, testantal konstant). Fixad i
    #      playwright.config.ts — se dess kommentar för hela härledningen,
    #      inklusive varför kostnaden är KONCENTRERAD till de fem tester som
    #      parkerar nätverket (9000 ms var) snarare än utsmetad.
    #
    #   2. STRUKTUREN. Hermetik-självtestet var ett STEG här och är nu ett
    #      eget, PARALLELLT jobb (`acceptance-sjalvtest` nedan). De två
    #      arbetsmängderna är jämnstora (261–352 s mot 218–313 s), så det
    #      jobbet mätte summan av dem mot ett tak avsett för en av dem.
    #      Väggklockan blir max(A,B) i stället för A+B — utan att en enda
    #      `workers`-siffra rörs och utan någon svit som delas, alltså utan
    #      det skalningsantagande stycket ovan kräver mätning för. Rivningen
    #      av det gamla "beviset körs efter sviten med avsikt" är öppet
    #      motiverad vid det nya jobbet, inte tyst.
    #
    # DÄRFÖR LIGGER TALET 12 KVAR (2026-08-17). Efter (1) och (2) mäter taket
    # detta jobbs skarpa svit ensam: svansen 352 s minus gatens ~62 s ≈ 290 s
    # ≈ 4,8 min, alltså ~7 min marginal mot ett orört tak. En höjning hade
    # köpt samma andrum genom att göra skyddsnätet slappare i stället för
    # arbetet mindre; task-239 AC #2 kräver uttryckligen det förra utan det
    # senare.
    #
    # ═══ TASK-239 VARV 3 (2026-09-02) — ANDRUMMET TOG SLUT IGEN, SHARDAT ═══
    #
    # ORGANISK TILLVÄXT FORTSATTE, PRECIS SOM FÖRUTSPÅTT. Klassen gick
    # 233 → 461 tester (+98 %) mellan 2026-08-17 och 2026-09-02 — INTE
    # warmup-gaten, som redan var stängd. Mätt i en RENODLAD (ej kö-belastad)
    # PR-CI-körning samma dag: den skarpa sviten ensam tog 461 s (7m41s,
    # run 33612071306, job 100189512738) — redan mer än HELA den marginal
    # föregående varv projicerade. Under samtidig kö-last blev det värre: PR
    # #2209:s två merge_group-körningar (33613134860, 33614762259) fick
    # jobbet `cancelled` på TAKET båda gångerna — 09:15:58→09:28:09 (12m11s)
    # och 09:33:50→09:45:59 (12m09s) — medan tre andra fulla sviter körde
    # parallellt på samma runner-flotta (kö-poster #2211/#2214 + PR-CI för
    # samtidiga agent-PR:er). Kön tolkade båda som `failed_checks` och
    # sparkade PR:en ur kön två gånger (`RemovedFromMergeQueueEvent
    # reason=failed_checks`, 09:28:39 och 09:46:11).
    #
    # ÅTGÄRDEN ÄR PLAYWRIGHTS EGEN SHARDING (`--shard=I/N`), INTE EN TREDJE
    # STRUKTUR-KLYVNING. Varv 2 delade en SEKVENTIELL A+B till max(A,B) genom
    # att göra hermetik-självtestet till ett eget jobb — den hävstången är
    # förbrukad (det finns bara EN skarp svit kvar i det här jobbet). Nästa
    # steg är att dela SVITEN SJÄLV, vilket `acceptance`-jobbets egen
    # kommentar ovan pekat ut sedan task-59.7 som "den varaktiga häven" MEN
    # krävde mätning innan aktivering: mätningen finns nu (861 rader ovan),
    # och kostnaden är verifierad noll — `--shard` splittrar på FIL-gränser
    # (playwright/lib/runner/index.js:s `createTestGroups`, läst i källan i
    # den installerade 1.62.1:an), så INGEN fil delas mellan shards och
    # `overskuggnings-rapport.ts`s per-fil-invariant (task-62) hålls. En shard
    # utan tilldelade tester är per DESIGN inget fel: samma källa
    # (`runner/index.js` rad ~6178) undantar uttryckligen `config.shard`-läget
    # från "no tests found"-fällningen, så URVAL-grenen (en handfull
    # spec-filer på PR-ytan) kan aldrig råka ut för en tom, fällande shard.
    #
    # MATRISEN ÄR VILLKORAD PÅ `inputs.acceptance_selection`, INTE STATISK.
    # Tom urval (post-merge/nightly/merge_group — full klass, den ENDA ytan
    # som faktiskt sett cancellationerna ovan) ⇒ 3 shards. Ett satt urval
    # (PR-ytans delmängd, redan snabb) ⇒ 1 shard, oförändrat beteende och
    # ingen extra runner-uppstart för en körning som redan har marginal. Detta
    # är samma "kör MER aldrig MINDRE"-asymmetri som `acceptance-urval.sh`
    # själv bär — matrisen lägger ingen egen bedömning ovanpå den, den LÄSER
    # samma `inputs.acceptance_selection` steget nedan redan konsumerar.
    #
    # TALET 3 ÄR EN MARGINALBERÄKNING, INTE EN GISSNING. 461 s / 3 ≈ 154 s
    # testtid per shard + samma ~30 s infrastruktur (checkout/npm ci/
    # Playwright-cache) som resten av jobbet mäter ≈ 184 s (~3 min) mot ett
    # ORÖRT 12-min-tak — cirka 9 min marginal i en RENODLAD körning, en
    # bredare säkerhetsmarginal än föregående varvs ~7 min gav mot samma
    # sortens organiska tillväxt som just åt upp den. PR:ens egen shardade
    # CI-körning (se PR-kroppen) bär den FÖRSTA skarpa mätningen av faktisk
    # per-shard-väggklocka; siffran 3 omprövas om den mätningen visar
    # obalans eller otillräcklig marginal.
    #
    # `strategy.job-total` (INTE ett hårdkodat "3" i steget nedan) håller
    # nämnaren i `--shard=I/N` i synk med matrisens FAKTISKA storlek —
    # skiftar `[1,2,3]` till fler/färre element någon gång behöver bara
    # matris-uttrycket ändras, aldrig två ställen.
    #
    # `.ci-parity-policy.json`s `exprSubstitutions` fick två nya poster
    # (`${{ matrix.shard }}` → `"1"`, `${{ strategy.job-total }}` → `"1"`) —
    # `1/1` är Playwrights no-op-shard (hela sviten i en enda shard, samma
    # `filterForShard`-källa), så `npm run verify:ci-parity`s lokala FULLA
    # körning fortsätter täcka HELA klassen i EN process, precis som förut.
    # Lokal paritet tappar därmed INTE djup — den prövar bara aldrig
    # sharding-TOPOLOGIN (det gör CI:s tre parallella jobb).
    timeout-minutes: 12
    strategy:
      fail-fast: false
      # Villkorad på SAMMA input steget `Acceptance tests (hermetiska)` redan
      # läser (`ACCEPTANCE_URVAL`, se nedan) — se motiveringen ovan för
      # varför urval-ytan medvetet INTE shardas.
      matrix:
        shard: ${{ fromJson(inputs.acceptance_selection == '' && '[1,2,3]' || '[1]') }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Samma cache-nyckel som a11y/test-staging (ADR-029 §1c) — först färdiga
      # jobbet värmer, de andra hit:ar.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache-acceptance
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # INGEN `env:` — och det är hela poängen. Scriptets env-flagga startar
      # dev-servern med fixtur-env ur playwright.config.ts; PLAYWRIGHT_TEST_BASE_URL
      # lämnas osatt eftersom acceptance-projektet aldrig kör mot en deployad URL.
      # URVALET (TASK-75). Tomt `ACCEPTANCE_URVAL` ⇒ hela klassen, vilket är vad
      # post-merge.yml och nightly.yml alltid får. Är den satt har ci.yml:s
      # `acceptance-urval`-steg redan validerat varje post mot mönstret OCH mot
      # disken; steget nedan gör ingen egen bedömning och ska inte börja göra
      # det — två ställen som klassar är två ställen som kan drifta isär.
      #
      # `read -r -a` och inte oskyddad ordsplittring: listan går in i en array
      # och expanderas citerad, så en post med oväntat innehåll blir ETT
      # argument i stället för ett skal-uttryck. Angriparstyrbarheten är reell —
      # posterna härrör ur filnamn i en PR.
      # TASK-239 VARV 3: SHARD-VARIABLERNA. `ACCEPTANCE_SHARD_INDEX` +
      # `ACCEPTANCE_SHARD_TOTAL` går bara in i `--shard=I/N` när urvalet är
      # tomt (full klass) — grenen `-n "${ACCEPTANCE_URVAL}"` nedan är
      # OFÖRÄNDRAD och rör dem aldrig, så PR-ytans urval-körning beter sig
      # exakt som förut. `strategy.job-total` (inte ett hårdkodat tal) håller
      # nämnaren i synk med matrisens faktiska storlek, se jobbets kommentar
      # ovan för hela härledningen.
      - name: Acceptance tests (hermetiska)
        env:
          ACCEPTANCE_URVAL: ${{ inputs.acceptance_selection }}
          ACCEPTANCE_SHARD_INDEX: ${{ matrix.shard }}
          ACCEPTANCE_SHARD_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          if [ -n "${ACCEPTANCE_URVAL}" ]; then
            read -r -a urval <<< "${ACCEPTANCE_URVAL}"
            echo "▶ URVAL — ${#urval[@]} av klassens spec-filer: ${ACCEPTANCE_URVAL}"
            echo "  Full klass körs på det mergade trädet av post-merge.yml."
            npm run test:acceptance -- "${urval[@]}"
          else
            echo "▶ FULL ACCEPTANCE-KLASS — shard ${ACCEPTANCE_SHARD_INDEX}/${ACCEPTANCE_SHARD_TOTAL}."
            npm run test:acceptance -- --shard="${ACCEPTANCE_SHARD_INDEX}/${ACCEPTANCE_SHARD_TOTAL}"
          fi

      # Artefaktnamnet bär shard-index (TASK-239 VARV 3): `upload-artifact@v4+`
      # kräver unika namn INOM en körning, och tre matrix-jobb som alla hette
      # `playwright-acceptance-artefakter` hade kollaterat på den andra
      # uppladdningen. Samma form som `acceptance-sjalvtest`s EGNA namn löste
      # kollisionen mot DETTA jobb i varv 2.
      - name: Ladda upp Playwright-artefakter vid rött
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-acceptance-artefakter-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Tvåsidigt bevis, task-60 / T104. Den gröna sviten i `acceptance` ovan visar
  # att appen beter sig rätt GIVET fixturens svar; detta jobb visar att svaren
  # faktiskt BÄR testerna — normalläget töms, testens egna network.use() görs
  # verkningslösa, och varje test måste då fällas AV VAKTEN. Ett test som
  # överlever konsumerar inget EF-svar och bevisar inget om databeteendet.
  # ADR-080 beslut 3: VILLKOR för acceptance-klassens existens, inte
  # förhandlingsbart — och oförändrat av att beviset flyttat hit.
  #
  # ═══ VARFÖR ETT EGET JOBB SEDAN TASK-239 (2026-08-17) ═══
  #
  # Beviset var ett STEG i `acceptance`, efter den skarpa sviten. Den formen
  # bar en uttrycklig motivering som HÄRMED RIVS ÖPPET, inte tyst: *"Steget
  # körs EFTER den skarpa sviten med avsikt — är den röd stannar jobbet där,
  # och ett självtest mot en redan trasig svit hade bara gett två röda besked
  # om samma fel."*
  #
  # Den motiveringen var ett SIGNAL-argument, och avvägningen har vänt eftersom
  # dess pris växte medan dess värde stod still. Mätt (task-239 AC #1 +
  # verifiering 2026-08-17, `gh api .../actions/jobs` mot post-merge-körningar,
  # 233 tester): den skarpa sviten 261–352 s och beviset 218–313 s — de två
  # stegen är i praktiken JÄMNSTORA, och tillsammans 94–96 % av jobbets
  # väggklocka. Sekventiellt betyder det A+B mot ett `timeout-minutes: 12`.
  # Två fällningar har redan betalats: run 31958171806 (12,28 min, `#1428`,
  # cancelled MITT I beviset) och run 31962091899 (12,08 min, `#1434`).
  # Kostnaden av det rivna designvalet är alltså numera en falsk röd på
  # timeout — samma signal-förstörelse som taket självt finns för att undvika
  # — medan dess vinst är att en agent slipper läsa ett andra rött besked som
  # pekar på samma fil. Den bytesaffären går inte ihop längre.
  #
  # PARALLELLT, INTE SNABBARE PER TEST. Väggklockan blir max(A,B) i stället för
  # A+B. Detta är den form av parallellisering `acceptance`-jobbets egen
  # takkommentar pekar ut som "den varaktiga häven" — men UTAN det antagande
  # den samtidigt varnar för: här delas ingen svit, och ingen `workers`-siffra
  # höjs. De två arbetsmängderna var redan oberoende; de kör nu på var sin
  # runner med var sina kärnor och sin egen oförändrade worker-uppsättning, så
  # ingen CPU-mättnad införs och ingen skalningsfaktor behöver mätas. Det är
  # aritmetik, inte en hypotes. (En `workers`-höjning vore det motsatta, och
  # playwright.config.ts:s acceptance-block har mätt sig fram till att INTE
  # röra den siffran — se dess § VIDEO-FORMEN ÄR PRÖVAD.)
  #
  # VAD SOM INTE ÄNDRAS: samma svit, samma urval, samma `--retries=0`, samma
  # avstängda artefakter. Beviset körs på VARJE landning precis som förr.
  #
  # KOSTNADEN, MÄTT I CI OCH INTE PROJICERAD FRÅN LOKALT (historik, gäller
  # alltjämt). Första skarpa körningen tog 289 s mot ~50 s lokalt, och drev
  # jobbet till 6,5 min mot taket 8. Orsaken var `retries: CI ? 2 : 0`: i
  # självtestläget är en fällning det FÖRVÄNTADE utfallet, så varje test kördes
  # tre gånger och spelades in på video — 153 körningar för noll extra
  # information. Skriptet kör därför `--retries=0` och config stänger av
  # failure-artefakter i regimen. Efter fixen: 73 s (mätt med CI=1 lokalt,
  # 297 s → 73 s i samma uppställning).
  #
  # Retries vore dessutom FEL här, inte bara dyrt: ett test som fäller vid
  # första försöket men passerar vid andra är per definition inget
  # hermetik-bevis, och hade räknats som grönt.
  #
  # URVALET GÄLLER ÄVEN HÄR (TASK-75), och det är ingen detalj: kördes den
  # skarpa sviten på EN spec-fil men beviset på arton, blev beviset den
  # kritiska vägen och urvalet en halv besparing. Steget bär samma
  # `read -r -a`-form och samma tomma default som `acceptance`-jobbets.
  acceptance-sjalvtest:
    name: Acceptance — tvåsidigt bevis (hermetik-självtest)
    runs-on: ubuntu-latest
    # SAMMA TAK SOM `acceptance` VAR TÄNKT ATT VARA, av samma skäl: de två
    # arbetsmängderna är jämnstora (mätserien ovan), och samma längd ska ha
    # samma tak. Efter delningen mäter taket EN av dem i stället för summan —
    # marginalen mot svansen (313 s beviset, 352 s sviten) gick från ~1,0 min
    # till ~5,7 min UTAN att taket rörts, vilket var hela poängen med
    # task-239 AC #2.
    #
    # HÖJT 12→20 MIN 2026-09-03 (enabling-detour, S115): svit-growth i S115
    # (`tests/acceptance/anmalan-avbokning.acceptance.test.ts` +9,
    # `tests/acceptance/anmalan-ombokning.acceptance.test.ts` +18) åt upp
    # marginalen. Fyra `cancelled`-avbrott samma dag (jobb-timeout, inte
    # testfel): PR-run 33758913155 + 33763097230 (#2267), 33760261291
    # (#2272), kö-run 33765539135 (#2267, 14:13:13→14:25:31 = 12 min 18 s).
    # Gröna körningar samma dag: 9:02, 11:55, 11:21, 9:56 (`gh run view <id>
    # --json jobs`). 20 min ≈ 2× typisk körtid — branschpraxis-headroom, ingen
    # ny mätserie. Uppföljningskort (per-fil-mätning + delningsförslag):
    # se backlog-kortet skapat i samma PR.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Samma cache-nyckel som acceptance/a11y/test-staging (ADR-029 §1c) —
      # först färdiga jobbet värmer, de andra hit:ar. Delningen ovan lägger till
      # EN konsument av samma nyckel; den skapar ingen ny cache-yta.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache-acceptance-sjalvtest
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Acceptance-klassens tvåsidiga bevis (hermetik-självtest)
        env:
          ACCEPTANCE_URVAL: ${{ inputs.acceptance_selection }}
        run: |
          set -euo pipefail
          if [ -n "${ACCEPTANCE_URVAL}" ]; then
            read -r -a urval <<< "${ACCEPTANCE_URVAL}"
            npm run test:acceptance:sjalvtest -- "${urval[@]}"
          else
            npm run test:acceptance:sjalvtest
          fi

      # EGET artefaktnamn, inte `acceptance`-jobbets: `upload-artifact@v4+`
      # avvisar två uppladdningar med samma namn i samma körning, och efter
      # delningen kan båda jobben vara röda samtidigt. `failure() ||
      # cancelled()` av samma skäl som överallt annars (TASK-237): utan
      # `cancelled()` lämnar en takfällning noll spår.
      - name: Ladda upp Playwright-artefakter vid rött
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-acceptance-sjalvtest-artefakter
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Webbläsarbeteende — TASK-131, ADR-094. MUTEXFRITT och secret-fritt, samma
  # placeringsmotivering som Acceptance ovan: jobbet har ingen
  # `concurrency`-grupp och inget `needs: [purge]`, så det köar aldrig bakom
  # `staging-tests`.
  #
  # VARFÖR ETT EGET JOBB OCH INTE EN GREN AV ACCEPTANCE. De två klasserna
  # bevisar olika saker. Acceptance bevisar att appen renderar rätt GIVET ett
  # svar av en viss FORM — och bär därför fixturvärlden (MSW) plus
  # hermetik-självtestet som bevisar att varje test faktiskt hänger på den
  # (steget ovan, `Acceptance-klassens tvåsidiga bevis`). Webbläsarbeteende-
  # klassen har inget svar att bevisa ett beroende av: dess tester rör sig
  # ALDRIG över nätverket (plattformsdetektering läser `navigator`/
  # `matchMedia`, prompt-flödet lyssnar på webbläsar-events) — per
  # konstruktion, inte av tur. Att lägga dem i Acceptance-jobbet är precis det
  # TASK-131 löste: `scripts/hermetik-sjalvtest.mjs` fällde alla 11 med
  # "Testet överlever utan fixturens svar och bevisar därför inget om appens
  # databeteende" — vakten gjorde rätt (ADR-080 beslut 3, VILLKOR för
  # klassens existens, inte förhandlingsbart), placeringen var fel. Att bygga
  # ett eget hermetik-självtest HÄR hade varit teater: det finns ingen
  # fixturvärld att ta bort för att bevisa att testet fäller.
  #
  # INGET dependabot-skip, av samma skäl som Acceptance: jobbet kräver INGA
  # secrets — fixtur-env:en i playwright.config.ts (`VITE_SUPABASE_URL`/
  # `ANON_KEY`) är en litteral platshållare som appen aldrig faktiskt anropar
  # (se konstantens kommentar i playwright.config.ts), inte ett `secrets.*`-
  # värde.
  #
  # `continue-on-error` FÖREKOMMER INTE, av samma skäl som Acceptance: flaggan
  # hade gjort `needs`-resultatet till `success` oavsett utfall och tystat
  # paraply-checken (`ci-passed`) på en röd svit.
  webblasarbeteende:
    name: Webblasarbeteende
    runs-on: ubuntu-latest
    # Mätt lokalt (macOS, 11 tester): 18,1–29,2 s helsvit. INTE en CI-mätning
    # — se § i CONTRIBUTING.md. 8 min matchar a11y-jobbets tak för en svit av
    # jämförbar (liten) storleksordning; ingen egen mätserie i CI finns ännu
    # för att sätta ett tightare tak, och ett för snävt tak riskerar precis
    # den falska-röd-på-timeout-signal-förstörelse Acceptance-jobbets
    # kommentar varnar för.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Samma cache-nyckel som acceptance/a11y/test-staging (ADR-029 §1c) —
      # först färdiga jobbet värmer, de andra hit:ar.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache-webblasarbeteende
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # INGEN `env:` — samma skäl som Acceptance: scriptets env-flagga startar
      # dev-servern med fixtur-env ur playwright.config.ts; ingen secret
      # behövs eftersom appen aldrig gör ett nätverksanrop dit (se
      # playwright.config.ts § WEBBLASARBETEENDE_DEV_PORT).
      - name: Webblasarbeteende-tester (fixturfritt, noll nätverksanrop)
        run: npm run test:webblasarbeteende

      # Playwright-artefakter vid RÖTT, eller vid takfällning (cancelled —
      # jobbets timeout-minutes slår till): utan cancelled() här hoppar
      # steget över och en takfällning lämnar noll traces, screenshots eller
      # sammanfattning — samma tredje identiska mönster som acceptance- och
      # test-staging-jobbens artefaktsteg (forensik S3, TASK-237; fynd ur
      # TASK-237 utanför dess eget kort-scope, registrerat och åtgärdat här
      # som TASK-239 AC #4, PR #1380 för de två andra instanserna).
      - name: Ladda upp Playwright-artefakter vid rött
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-webblasarbeteende-artefakter
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # A11y (axe-runner) — rör ALDRIG staging (egen alltid-färsk dev-server på
  # dedikerad port, ADR-045 beslut 1+3) → ingen mutex. Dependabot-skip på
  # JOBB-nivå (ADR-031 Lager 3, secrets-isolation).
  #
  # `inputs.run_a11y` (A7:6 / TASK-70.4) — ci.yml skickar false villkorslöst, så
  # jobbet instansieras aldrig av PR-grinden. Villkoret står BREDVID
  # dependabot-skippet, inte i stället för det: de stänger olika saker — det ena
  # en ANROPAR-YTA, det andra en aktör vars körningar saknar Actions-secrets.
  # Slås de ihop tappas den ena betydelsen tyst.
  #
  # ADR-045 § Beslut 3 ("test:a11y hör till Test+Build-jobbets sfär, kod-grindad")
  # står ORÖRD av flaggan: jobbet bor kvar i den delade tunga sviten och är
  # fortfarande kod-grindat — på post-merge-ytan via `klassning`-jobbets ärvda
  # D0-beslut (post-merge.yml). Det som ändrats är VILKEN anropare som kör det,
  # inte vilken sfär det tillhör.
  a11y:
    name: A11y (axe-runner)
    if: ${{ inputs.run_a11y && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache Playwright browsers (~150MB) per ADR-029 §1c. Samma nyckel som
      # test-staging — först färdiga jobbet värmer, det andra hit:ar.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache-a11y
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # A11y-runner per ADR-045 beslut 1+3: PLAYWRIGHT_TEST_BASE_URL lämnas
      # OSATT så webServer-blocket i playwright.config.ts startar Vite dev-
      # servern — /dev/primitives är DEV-guardad (ADR-044).
      - name: A11y tests (axe-runner)
        run: npm run test:a11y
        env:
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

  # Staging (API + E2E) — bär EN staging-miljö. Mutexen staging-tests
  # serialiserar över ALLA staging-rörande runs (PR ∥ PR, PR ∥ main-push OCH
  # PR ∥ nightly): concurrency-gruppen är en global sträng oavsett vilken
  # anropare som instansierar jobbet (reusable-nesting påverkar inte scopet;
  # bevisat via spike 2026-07-23). queue: max köar väntande FIFO;
  # cancel-in-progress medvetet OSATT (krav för queue: max).
  test-staging:
    name: Staging (API + E2E)
    # needs purge: setup-purgen (ADR-060 punkt 3–4) ska ha kört FÖRE staging-
    # stegen. Villkoret tolererar 'skipped' (dependabot) men INTE 'failure'.
    needs: [purge]
    # inputs.run_staging: false vid D1 → staging + mutex skippas (a11y/pure/build
    # kör ändå i sina egna jobb). Internt villkor, aldrig path-filter (AC#5).
    if: ${{ !cancelled() && inputs.run_staging && github.actor != 'dependabot[bot]' && (needs.purge.result == 'success' || needs.purge.result == 'skipped') }}
    runs-on: ubuntu-latest
    # DETTA TAK ÄR POST-MERGE.YML:S FRÄMSTA AVBROTTSKÄLLA (T135, 2026-08-10 —
    # TASK-178), inte concurrency-gruppen nedan. Normal väggklocka ligger på
    # ~6–7 min (TASK-59.7 mätte 393 s median 2026-07-28; tre färska gröna
    # körningar 2026-08-10 låg 5m48s–6m48s). Tre instanser 2026-08-07 (körning
    # 31196593426/31197915169/31198327068) mätte i stället 12m15–12m16s —
    # jobbet slog i TAKET, inte i mutexen: `queue: max` nedan kan bara
    # evictera VÄNTANDE poster, aldrig en redan pågående (GitHub-dokumentation,
    # verifierad TASK-178), och alla tre hade redan passerat API-steget. En
    # burst av flakiga/timeoutande E2E-tester (playwright.config.ts:
    # `retries: process.env.CI ? 2 : 0`) räcker för att äta hela marginalen —
    # varje missad test kostar upp till tre gånger sin egen körtid. Höj
    # ALDRIG detta tak reflexmässigt vid nästa post-merge-cancellation: den
    # bakomliggande flake-orsaken är INTE fastställd av T135, bara
    # avbrottsMEKANISMEN. Se tråden för den öppna eskaleringen.
    #
    # HÖJT 12→20 MIN 2026-09-06 (TASK-404, enabling-detour) — samma form som
    # TASK-383 gjorde för acceptance-självtestet. Detta är INTE reflexen
    # stycket ovan varnar för: PRD TASK-402:s skivor lägger var och en till
    # staging-e2e-fall i samma svit, och marginalen krymper mätbart per
    # landning. Post-merge-mätserie (`gh api .../actions/runs/<id>/attempts/
    # <n>/jobs`, main):
    #   33989193147 (5c7a8a9d) attempt 1: 12m16s CANCELLED (20:09:18–20:21:34Z)
    #   33989193147 (5c7a8a9d) attempt 2: 11m35s grön     (20:52:03–21:03:38Z)
    #   33996542511 (364f75b9, TASK-402.2): 11m46s grön   (22:40:28–22:52:14Z)
    #   34017272056 (b6a598c1, TASK-402.3) attempt 1: 12m17s CANCELLED
    #     (2026-09-06 06:45:07–06:57:24Z); omkörningen pågick vid denna commit.
    # AC #1 (per-fil-väggklocka för tests/e2e/*.staging.test.ts) gick INTE att
    # utvinna ur jobbloggen: CI-reportern är 'dot' (se
    # tests/support/fixturvarld/overskuggnings-rapport.ts:
    # `PLAYWRIGHT_DEFAULT_REPORTER = process.env.CI ? 'dot' : 'list'`), som
    # bara skriver framstegs-punkter plus en aggregerad slutsumma — inga
    # per-test-tidsstämplar i klartext, och steget "Ladda upp Playwright-
    # artefakter vid rött e2e" nedan laddar bara upp playwright-report/ vid
    # failure()||cancelled(), så en GRÖN körning lämnar ingen rapport-artefakt
    # att läsa i efterhand heller. Per-STEG i stället, två fulla gröna
    # körningar (API-steget/E2E-steget, väggklocka från steg-start till nästa
    # steg-start):
    #   364f75b9 (402.2): API 5m32s (524 test) · E2E 5m39s (241 test, 226
    #     passed/14 skipped/1 flaky) · jobbtotal 11m46s
    #   5c7a8a9d attempt 2:  API 5m43s (524 test) · E2E 5m24s (239 test, 224
    #     passed)                     · jobbtotal 11m35s
    # 20 min ≈ nästan 2× värsta uppmätta jobbtotal (12m17s) — branschpraxis-
    # headroom i TASK-383:s form, ingen ny mätserie utöver ovanstående.
    # Detta köper marginal, det löser inte tillväxten: sviten fortsätter växa
    # med varje TASK-402.x-skiva. Se TASK-404 (denna höjning) och TASK-383
    # (samma mätnings-uppföljning för acceptance-klassen); delning av sviten
    # eller flytt till en hermetisk fixturvärld är Marcus eget vägval, inte
    # verkställt här.
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: staging-tests
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # Medvetet UTAN fetch-depth-config — utanför bärar-mängden (ADR-039).

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # ADR-031 Lager 3 (Alt D Hybrid): staging kräver Actions-secrets som
      # Dependabot-workflows saknar — därav jobb-nivå-skippet ovan.
      - name: API tests (staging)
        run: npm run test:api:staging
        env:
          STAGING_REQUIRED: '1'
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_REGISTRATION_RECORD_ID: ${{ secrets.TEST_REGISTRATION_RECORD_ID }}

      - name: E2E tests (staging)
        run: npm run test:e2e:staging
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}

      # Playwright-artefakter vid RÖTT e2e-steg, eller vid takfällning
      # (cancelled — jobbets timeout-minutes slår till): utan cancelled()
      # här hoppar steget över och en takfällning lämnar noll traces,
      # screenshots eller sammanfattning (forensik S3, TASK-237).
      # global-teardown.ts har redan purgat klartext-lösenord ur
      # error-context.md (ADR-061 pelare 3, T29) innan uppladdningen.
      - name: Ladda upp Playwright-artefakter vid rött e2e
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-e2e-artefakter
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # [TASK-309.15] ÄGAR-MANIFESTET över de kastbara staging-rader denna
      # körning skapade (tests/support/kastbara-poster.ts, JSONL). Lämnas över
      # till jobbet `purge-efter` nedan, som är den enda Airtable-creddade
      # kontexten: test-jobbet får ALDRIG en Airtable-token (ADR-060 punkt
      # 2+4, EF-only-gränsen), och någon delete-EF för event finns inte — så
      # sviten KAN strukturellt inte städa efter sig med sina egna medel.
      #
      # `if: always()` (inte `failure() || cancelled()` som Playwright-
      # artefakten ovan): ett RÖTT eller AVBRUTET staging-steg är precis när
      # städningen behövs mest, men den behövs lika mycket när allt gick bra —
      # det är de GRÖNA körningarna som producerat de 151 kvarliggande
      # ZZ-eventen (mätt 2026-08-24).
      #
      # `retention-days: 1` — manifestet är förbrukat i samma workflow-körning
      # och har inget forensiskt värde efteråt (till skillnad mot
      # Playwright-artefakterna ovan, som är felsökningsunderlag i sju dagar).
      - name: Ladda upp ägar-manifestet för kastbara staging-poster
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kastbara-poster
          path: .kastbara/poster.jsonl
          retention-days: 1
          if-no-files-found: ignore

  # Staging sentinel purge, EFTER körningen — FÖRSTA försvarslinjen (TASK-309.15).
  #
  # VARFÖR JOBBET FINNS. `purge` ovan är setup-purgen (ADR-060 punkt 3): den
  # städar FÖRE varje staging-jobb och är därmed strukturellt oförmögen att
  # städa fönstret MELLAN en körning och nästa staging-jobb. De kastbara
  # eventen bär framtida `startdatum` och blir KOMMANDE event i appens
  # eventväljare under hela det fönstret. Mätt 2026-08-24: 151 kvarliggande
  # ZZ-event, samtliga yngre än 2,4 h — setup-purgen HADE alltså kört. Marcus
  # valde ett av dem vid en granskning och fick en tom genereringsvy, vilket
  # läste som ett designfel i vyn och kostade en granskningsrunda.
  #
  # VARFÖR ETT EGET JOBB OCH INTE ETT STEG I `test-staging`. Exakt samma skäl
  # som `purge` ovan bär: egen runner-VM med egen secret. Ett purge-steg i
  # test-jobbet hade lagt Airtable-token på samma VM som testerna kör på och
  # rivit EF-only-gränsen (ADR-060 punkt 2+4) för en ren bekvämlighet.
  #
  # VARFÖR `always()`. Städningen ska ske oavsett testutfall — och oavsett om
  # workflowet avbröts. `!cancelled()` hade hoppat över den vid en
  # takfällning, alltså vid en av de körningar som lämnar MEST skräp.
  # Jobbet är ofarligt att köra utan manifest: skriptet loggar "inget att
  # städa" och avslutar 0.
  #
  # INGEN staging-mutex, av samma skäl som `purge`: jobbet rör bara poster som
  # står i den avslutade körningens EGET manifest, och ett samtidigt lokalt
  # test kan per konstruktion aldrig hamna där.
  purge-efter:
    name: Staging sentinel purge (efter körning)
    needs: [test-staging]
    if: ${{ always() && inputs.run_staging && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Medvetet UTAN fetch-depth-config — samma skäl som `purge`-jobbet:
        # kör bara purge-skriptet + policy-filen, ingen git-historik behövs.

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      # `continue-on-error` är BÄRANDE, inte slarv: artefakten saknas helt när
      # `test-staging` aldrig kom så långt som till sitt uppladdningssteg
      # (runner-krasch, tidig fällning), och download-artifact FÄLLER på en
      # artefakt som inte finns. Ett rött städjobb i det läget hade dolt det
      # verkliga felet bakom ett andra. Utan fil loggar purge-skriptet
      # "inget ägar-manifest" och avslutar 0 — setup-purgen tar raderna vid
      # nästa staging-jobb, precis som före denna skiva.
      - name: Hämta ägar-manifestet
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: kastbara-poster
          path: .kastbara

      # STAGING_AIRTABLE_TOKEN = samma least-privilege-PAT som `purge`-jobbet,
      # scopad till ENBART staging-basen (data.records:read+write) — kan aldrig
      # röra prod. De fyra TEST_*-secreten behövs INTE här: efter-körning-läget
      # rör bara Airtable-targets, aldrig storageTargets (Storage-purgen är
      # ålders-driven och hör hemma i setup-jobbet).
      - name: Purga denna körnings kastbara poster
        run: node scripts/purge-staging-sentinels.mjs --efter-korning
        env:
          STAGING_AIRTABLE_TOKEN: ${{ secrets.STAGING_AIRTABLE_TOKEN }}
