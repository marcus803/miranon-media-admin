# === REGEL: NÄR en markör registreras (TASK-287, 2026-08-21) ===
#
# En markör läggs till HÄR vid KONVERGENSENS FACIT-LÅSNING — samma landning
# som skapar tasks/sessions/bilagor/<pass>/facit.json med "godkand": null —
# INTE vid rivningen (B2 steg 4, se TASK-192-lärdomen ovan för STÄDNINGEN)
# och INTE i ett uppföljande pass. Rotorsak (TASK-287, orkestrerarens fynd
# 2026-08-21): S109:s två konvergenspass (uppdateringsnotis,
# meddelandefamiljen) facit-låstes och tre bygg-agenter (TASK-285.1/.2/.3)
# arbetade mot dem utan att någon lade en markör i sin egen landning — B3-
# spärren var mekaniskt aktiv (två manifest med "godkand": null) men
# skyddade NOLL av deras substrat, eftersom listan bara innehöll fem
# markörer från TIDIGARE, redan godkända pass. Detta är exakt den lucka
# TASK-192 varnade för i sin spegelbild: en markör som saknas är lika
# osynlig som en markör som blir kvar för länge, och båda upptäcks bara när
# någon råkar mäta.
#
# Checklista vid varje ny facit.json med "godkand": null:
#   1. Identifiera prototyp-SUBSTRATETS filer ur manifestets "kallor"-fält
#      — minus redan-skarpa/redan-promoverade filer. Exempel (TASK-287):
#      Uppdateringsnotis.tsx är en "kalla" men är REDAN den promoverade
#      formen (eget doc-block: "DENNA komponent rörs INTE av [rivningen] —
#      den ÄR den promoverade formen, inte prototyp-substrat") och behöver
#      ingen markör; MessageBoxPrototyp.tsx/AppErrorPrototyp.tsx är däremot
#      genuint substrat och behöver var sin.
#   2. Per fil: välj en sträng som (a) ger EXAKT EN träff-fil vid
#      `grep -rlF "<sträng>" src/` — verifiera före tillägg, aldrig efter,
#      (b) dör NÄR filen faktiskt rivs (en docblock-titelrad eller en unik
#      variabel/label — ALDRIG ett delat prefix som `[PROTOTYPE, …]` ensamt,
#      se TASK-241.1-avvisningen ovan för varför), och (c) överlever legitim
#      refaktorering fram till den dagen.
#   3. Lägg strängen i FACIT_PROTO_MARKORER i SAMMA commit som låser
#      manifestet — inte en separat uppföljande skiva. En markör som väntar
#      till "när det är dags att riva" hinner typiskt bara in i SAMMA commit
#      som rivningen, vilket är för sent för att ha skyddat NÅGOT under
#      mellanperioden (facit-låsning → godkännande).
#   4. Städa markören i SAMMA landning som rivningen (B2 steg 4) — redan
#      etablerad regel, se TASK-192-posten ovan. Symmetrisk med steg 3: en
#      markör registreras och avregistreras vid de två ändpunkterna av sin
#      livstid, aldrig däremellan.
#
# === SYSKONREGEL: ytans "referenser" deklareras vid SAMMA ögonblick ===
# (ADR-102 § Updates 2026-08-22, T157 — invariant d i check-facit.sh)
#
# Manifestets ytor får deklarera sitt MEKANISKA facit —
# ariaSnapshot-referenserna, ADR-103 B4 — som
#   "referenser": [{ "fil": "tests/visual/__aria__/…/x.aria.yml",
#                    "sha256": "<64 hex>" }]
# Grinden innehållslåser dem så snart manifestet är STÄMPLAT: ändras en
# referens utan att en AMENDERING-<datum>-<slug>.md-sidofil i samma katalog
# namnger både filen och dess nya sha256, fäller check-facit.sh.
#
# Deklarationen görs vid FACIT-LÅSNINGEN, i samma landning som skapar
# facit.json med "godkand": null — exakt samma ändpunkt som markören ovan,
# men med ett HÅRDARE skäl än dess: efter stämplingen är fönstret inte bara
# försuttet utan STÄNGT. ADR-104-hooken nekar varje agent-Edit/Write mot ett
# manifest vars "godkand" är satt (mätt 2026-08-22: en Edit som ENBART lade
# till en nyckel nekades med exit 2), så en retroaktiv deklaration kräver
# Marcus egen kanal.
#
# Frånvaro är tillåten men SYNLIG: check-facit.sh skriver vid varje körning
# ut hur många stämplade ytor som saknar nyckeln. 22 av 22 saknade den när
# regeln skrevs (2026-08-22) — backfillen är ett Marcus-moment och ett eget
# kort, inte något en agent kan utföra.
#
# TASK-287 (2026-08-21) → AVREGISTRERADE I TASK-285.11 (2026-08-22)
#
# TASK-287 lade FYRA markörer för notis-familjens facit-ytor
# (s109-uppdateringsnotis-konvergens + s109-meddelandefamiljen-konvergens),
# som då bar "godkand": null:
#
#   "[PROTOTYPE — KONVERGENS, S109] Växlare för uppdateringsnotisen."
#       → src/components/dev/NotisPrototypVaxlare.tsx
#   "Meddelandefamiljen i flödet + appfel-sidan."
#       → src/routes/dev/notis-prototyp.tsx
#   "Meddelanderutan i flödet, startad som EXAKT"
#       → src/components/dev/notis-prototyp/MessageBoxPrototyp.tsx
#   "Appfel-sidan, startad som EXAKT kopia av"
#       → src/components/dev/notis-prototyp/AppErrorPrototyp.tsx
#
# Marcus stämplade BÅDA manifesten 2026-08-22 (citat "Vi kör på det"
# respektive "Vi kör på det, godkänner", sha 932c2689), vilket öppnade
# ADR-102 B3-spärren. Rivningen (TASK-285.11) tog samtliga fyra filer, och
# markörerna avregistrerades i SAMMA landning — regeln "städa markören i
# SAMMA landning som rivningen" (B2 steg 4, checklistans punkt 4 ovan)
# tillämpad, inte uppskjuten. Kvar i listan nedan står ENBART markörer som
# vaktar ANDRA prototyp-familjers substrat (hållplats, åtgärds-/hem-sidan,
# sändytans overlay); de rörs inte av denna rivning.
#
# ═══ AC #5 (TASK-285.11): AppUpdateBanner FICK ALDRIG EGEN MARKÖR ═══
#
# TASK-287 bokförde öppet ett GAP: `?variant`-grenen och variabeln
# `prototypAktiv` INUTI src/components/AppShell/AppUpdateBanner.tsx saknade
# egen markör, eftersom en markör kräver en sträng ur just den filen och
# TASK-287 förbjöds att skriva i den (parallella TASK-285.6). Kortet lämnade
# två vägar: lägg markören i rivnings-skivan, ELLER motivera frånvaron
# öppet.
#
# TASK-285.11 valde MOTIVERINGEN, och skälet är strukturellt: en markörs
# HELA funktion är att skydda substrat under fönstret facit-låsning →
# godkännande. Det fönstret var STÄNGT när denna skiva körde (båda
# manifesten stämplade innan första raden revs). Att registrera en markör
# och avregistrera den i samma commit hade gett ett skydd med noll livslängd
# — precis den tomma gest checklistans punkt 3 varnar för ("en markör som
# väntar till 'när det är dags att riva' hinner typiskt bara in i SAMMA
