# "godkand": null får ingen av dem försvinna ur FACIT_PROTO_SOKVAG —
# rivning före Marcus godkännande är exakt vad ADR-102 B3 förbjuder.
# Mätt underlag för listan: ADR-102 § R7 (sju filer, ~106 grenar).
