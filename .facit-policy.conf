# shellcheck shell=bash
# shellcheck disable=SC2034
# Variables in this file are sourced and consumed by external
# scripts (scripts/check-*.sh). shellcheck cannot trace cross-file
# variable usage, so SC2034 ("appears unused") triggers as false
# positive. Disable is file-level and intentional.

# .facit-policy.conf
#
# Per-projekt config för scripts/check-facit.sh OCH
# scripts/deny-facit-godkand-skrivning.sh (delad sedan TASK-167 — den
# senare läser redan FACIT_BILAGE_ROT/FACIT_MANIFEST_NAMN härifrån;
# TASK-168 lägger till FACIT_GODKANN_NPM_SCRIPT/FACIT_GODKANN_SKRIPT_NAMN,
# se § Stämplingsskriptets identitet nedan).
# Skriptens LOGIK är universell (kan dupliceras till andra spokes utan
# refactor); värden här är PROJEKT-SPECIFIKA. Samma hub-spoke-portabilitet
# som .lesson-policy.conf och .frontmatter-policy.conf (Lesson #6, UNIVERSAL).
#
# === Duplicera till nytt spoke (3 steg) ===
# 1. cp scripts/check-facit.sh + scripts/lib/facit-validera.mjs + denna fil
# 2. Anpassa FACIT_BILAGE_ROT + FACIT_PROTO_MARKORER nedan
# 3. Lägg run_gate-raden i scripts/check-docs.sh (samma anrop-signatur)
#
# Källa: docs/decisions/ADR-102-prototypen-ar-facit-skarpa-ska-vara-identisk.md
#        Beslut B1 (prototypen ÄR facit) + B3 (rivning först efter godkännande).

# === Bilage-roten ===
# Katalogen där prototyp-passens bilage-kataloger bor. Grinden letar
# facit-manifest (FACIT_MANIFEST_NAMN) i varje underkatalog. Path relativt
# repo-root.
FACIT_BILAGE_ROT="tasks/sessions/bilagor"

# === Manifestets filnamn ===
# Ett manifest per prototyp-pass, colokaliserat med bilderna det beskriver.
# Frånvaro av manifest i en bilage-katalog UTAN facit-bilder är grönt —
# manifestet krävs först när katalogen bär minst en facit-bild.
FACIT_MANIFEST_NAMN="facit.json"

# === Facit-bildernas namnmönster ===
# En bild som matchar detta mönster MÅSTE vara deklarerad i manifestet.
# Rotorsak R4 (ADR-102): en odeklarerad facit-bild är oskiljbar från en
# passerad iterationsbild för den som läser katalogen.
FACIT_BILD_GLOB="facit-*"

# === Täckningsvarningen för invariant (d) (TASK-309.31) ===
# 1 = check-facit.sh NAMNGER varje stämplad yta som saknar nyckeln
#     "referenser" (manifest · yta · vad som saknas) på stderr, plus en
#     summeringsrad "N av M". 0 = bara den kosmetiska summeringsraden på
#     stdout, som före TASK-309.31.
#
# EXITKODEN PÅVERKAS INTE AV DETTA VÄRDE, i något läge. Omkopplaren styr hur
# MYCKET grinden berättar, aldrig om den fäller. Vill man göra avsaknaden
# fällande är vägen dit TASK-288:s backfill av "referenser" — inte en flagga
# här. Skälet står i ADR-102 § Updates 2026-08-28: en fällning i dag hade
# gjort 24 av 28 stämplade ytor röda på en gång, utan migrationsfönster, för
# en nyckel som aldrig varit obligatorisk.
#
# Varför en omkopplare alls, när defaultvärdet är det enda vi kör med: 24
# WARN-rader är rätt mängd i ETT repo med 15 manifest men fel mängd i ett
# spoke som just kopierat hit grinden och ännu inte deklarerat något. Skriptet
# bär logiken, denna fil bär mängden — samma snitt som resten av filen
# (Lesson #6, UNIVERSAL). Utelämnas nyckeln helt varnar grinden ändå:
# check-facit.sh defaultar till 1, eftersom tystnad aldrig får uppstå av
# att någon glömde skriva ett värde.
FACIT_VARNA_ODEKLARERAD_REFERENS="1"

